<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little Happy Valley</title>
  </head>
  <body>
    <main>
      <canvas id="world" aria-label="Synthetic downtown walking scene"></canvas>
      <section class="hud" aria-label="Game controls">
        <h1>Little Happy Valley</h1>
        <p>Synthetic walking proof · WASD or arrows to walk · Shift to sprint · Scroll to zoom</p>
        <p id="coordinates"></p>
        <p id="error" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
