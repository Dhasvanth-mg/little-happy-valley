name: Prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          gzip -nc package-lock.json | base64 -w 120 | sed 's/^/LOCK64:/'
          npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
